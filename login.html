<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Login - Parth Ranpariya CMS</title>
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-body d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 440px;">
      <div class="text-center mb-4">
        <a href="/" class="text-decoration-none">
          <h2 class="fw-bold text-gradient mb-1">Parth Ranpariya</h2>
        </a>
        <p class="text-muted-custom text-sm">Data Analyst · Portfolio CMS</p>
      </div>

      <div class="glass-card p-4 p-md-5">
        <div class="d-flex align-items-center gap-2 mb-4">
          <div class="stat-icon-wrap stat-icon-cyan">
            <i class="bi bi-shield-lock"></i>
          </div>
          <div>
            <h4 class="h5 fw-bold text-white mb-0">Admin Sign In</h4>
            <span class="text-xs text-dim">Authorized personnel only</span>
          </div>
        </div>

        <div class="alert alert-info py-2 px-3 text-xs mb-3">
          <i class="bi bi-info-circle me-1"></i> Default setup username: <code>admin</code>
        </div>

        <form id="admin-login-form">
          <div class="mb-3">
            <label for="login-username" class="form-label text-white text-sm">Username or Email</label>
            <input type="text" id="login-username" name="username" class="form-control form-control-dark" placeholder="admin" required autofocus />
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label for="login-password" class="form-label text-white text-sm mb-0">Password</label>
              <button type="button" id="btn-forgot-password" class="btn btn-link text-xs text-cyan p-0 text-decoration-none">Forgot Password?</button>
            </div>
            <input type="password" id="login-password" name="password" class="form-control form-control-dark mt-1" placeholder="••••••••" required />
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input bg-dark border-secondary" id="rememberMe" name="rememberMe" />
            <label class="form-check-label text-muted text-xs" for="rememberMe">Remember session on this device</label>
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-cyan w-100 justify-content-center py-2">
            <i class="bi bi-box-arrow-in-right"></i> Authenticate
          </button>

          <div id="login-alert-box" class="alert alert-danger py-2 px-3 mt-3 text-xs d-none"></div>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary">
          <a href="/" class="text-muted text-xs text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Return to Public Portfolio
          </a>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
      import { AuthService } from '/js/auth.js';

      // If already logged in, redirect straight to dashboard
      if (AuthService.isAuthenticated()) {
        window.location.href = '/admin/dashboard.html';
      }

      const form = document.getElementById('admin-login-form');
      const alertBox = document.getElementById('login-alert-box');
      const forgotBtn = document.getElementById('btn-forgot-password');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = form.username.value.trim();
        const password = form.password.value.trim();
        const rememberMe = form.rememberMe.checked;

        const btn = document.getElementById('btn-submit-login');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Verifying...`;
        alertBox.classList.add('d-none');

        try {
          await AuthService.signIn(username, password, rememberMe);
          window.location.href = '/admin/dashboard.html';
        } catch (err) {
          alertBox.textContent = err.message || 'Invalid username or password.';
          alertBox.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      });

      forgotBtn.addEventListener('click', async () => {
        const username = form.username.value.trim() || 'ranpariya012@gmail.com';
        try {
          const msg = await AuthService.sendPasswordReset(username);
          alertBox.className = 'alert alert-info py-2 px-3 mt-3 text-xs';
          alertBox.textContent = msg;
          alertBox.classList.remove('d-none');
        } catch (e) {
          alertBox.className = 'alert alert-warning py-2 px-3 mt-3 text-xs';
          alertBox.textContent = e.message;
          alertBox.classList.remove('d-none');
        }
      });
    </script>
  </body>
</html>
